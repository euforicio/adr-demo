name: "PR: Diff Review → Auto Summary (GitHub Models, latest inference API)"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to summarize (optional; for manual runs)"
        required: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: "pr-auto-summary-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.ref }}"
  cancel-in-progress: true

jobs:
  summarize-and-update:
    name: Generate summary from diff and update PR body
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) }}
    env:
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}

      # Auth for gh + model API
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}

      # Limits to keep prompts safe & cheap
      DIFF_MAX_CHARS: "180000"
      COMMIT_MSG_LIMIT: "30"
      FILE_LIST_LIMIT: "300"

      # PR body markers
      SUMMARY_START: "<!-- PR_SUMMARY:START -->"
      SUMMARY_END: "<!-- PR_SUMMARY:END -->"

      # Preferred/backup models
      PREFERRED_MODEL: "gpt-4o-mini"
      FALLBACK_MODELS: "gpt-4o,gpt-3.5-turbo"

      # Inference API base (latest syntax per docs)
      MODELS_BASE_URL: "https://models.inference.ai.azure.com"

    steps:
      - name: Preflight PR number
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PR_NUMBER:-}" ]]; then
            PR_GUESS=$(gh pr view --json number -q .number 2>/dev/null || true)
            if [[ -n "$PR_GUESS" ]]; then
              echo "PR_NUMBER=$PR_GUESS" >> "$GITHUB_ENV"
              echo "Using inferred PR number: $PR_GUESS"
            else
              echo "❌ PR number not provided and could not infer." >&2
              exit 1
            fi
          fi

      - name: Install deps
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y jq
          gh --version || true

      - name: Fetch PR metadata, files, commits, and full diff
        shell: bash
        env:
          PR: ${{ env.PR_NUMBER }}
        run: |
          set -euo pipefail
          gh api repos/$REPO/pulls/$PR > pr.json
          gh api repos/$REPO/pulls/$PR/files --paginate | jq -s 'add' > files.json
          gh api repos/$REPO/pulls/$PR/commits --paginate | jq -s 'add' > commits.json
          gh api -H "Accept: application/vnd.github.v3.diff" repos/$REPO/pulls/$PR > pr.diff

      - name: Build prompt context (context.md)
        shell: bash
        env:
          COMMIT_MSG_LIMIT: ${{ env.COMMIT_MSG_LIMIT }}
          FILE_LIST_LIMIT: ${{ env.FILE_LIST_LIMIT }}
          DIFF_MAX_CHARS: ${{ env.DIFF_MAX_CHARS }}
        run: |
          set -euo pipefail
          TITLE=$(jq -r '.title' pr.json)
          AUTHOR=$(jq -r '.user.login' pr.json)
          FILE_COUNT=$(jq 'length' files.json)
          ADDITIONS=$(jq '[.[].additions] | add // 0' files.json)
          DELETIONS=$(jq '[.[].deletions] | add // 0' files.json)

          {
            echo "# PR: ${TITLE}"
            echo "Author: @${AUTHOR}  •  Files changed: ${FILE_COUNT}  •  +${ADDITIONS} / -${DELETIONS}"
            echo
            echo "## Top commit messages"
            jq -r '.[].commit.message' commits.json | head -n "$COMMIT_MSG_LIMIT" | sed 's/^/- /'
            echo
            echo "## Changed files"
            jq -r '.[] | "- \(.status)\t\(.filename) (+\(.additions) / -\(.deletions))"' files.json | head -n "$FILE_LIST_LIMIT"
            echo
            echo "## PR diff (truncated for budget)"
            echo '```diff'
            head -c "$DIFF_MAX_CHARS" pr.diff
            echo
            echo '```'
          } > context.md

      - name: Generate PR summary via GitHub Models (latest inference API)
        shell: bash
        run: |
          set -euo pipefail

          # Use the model directly - GitHub Models now provides direct access
          MODEL_ID="${PREFERRED_MODEL}"
          echo "Using MODEL_ID=$MODEL_ID"
          echo "MODEL_ID=$MODEL_ID" >> "$GITHUB_ENV"

          # Safer heredoc assignment for multi-line system prompt
          SYS_PROMPT=$(cat <<'EOF'
You are a Staff+ engineer producing executive-quality, reviewer-friendly PR summaries.
- Ground everything ONLY in the provided PR diff and metadata; no speculation.
- Be concise, structured, and actionable; use bullets with strong verbs.
- Call out risks, breaking changes, and security implications if present.
- If uncertain, write "(unclear)" rather than guessing.
Output format (use EXACT headings):
### PR Summary (auto-generated)
**Intent**: One short sentence on the purpose of this change.

**Key Changes**
- Bulleted by module/area; each: what changed → why it matters.

**Impact**
- Performance: (n/a or succinct note)
- Security/Compliance: (n/a or succinct note)
- Breaking Changes: (n/a or list + migration note)

**Verification**
- Tests: (new/updated tests; how to run)
- Manual QA: (quick steps to validate)

**Migration/Follow-ups**
- (n/a or bullets: docs, flags, rollout, deprecations)

**Scope**
- Use the exact numbers from the context header: Files changed / +additions / -deletions  •  Risk: Low/Medium/High
EOF
          )

          # Read context file
          CONTEXT_CONTENT=$(<context.md)

          # Build payload with latest chat/completions shape
          jq -n --arg model "$MODEL_ID" --arg sys "$SYS_PROMPT" --arg ctx "$CONTEXT_CONTENT" \
            '{
              model: $model,
              messages: [
                { "role": "system", "content": $sys },
                { "role": "user",   "content": $ctx }
              ],
              max_tokens: 1200,
              temperature: 0.2
            }' > payload.json

          # Call inference endpoint - using the correct URL and headers
          HTTP_CODE=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$MODELS_BASE_URL/chat/completions" \
            --data @payload.json) || HTTP_CODE="000"

          if [[ "$HTTP_CODE" -lt 200 || "$HTTP_CODE" -ge 300 ]]; then
            echo "❌ Model API call failed with HTTP $HTTP_CODE"
            echo "Response body follows:"
            cat response.json || true
            
            # Try fallback models
            IFS=',' read -ra FALLBACKS <<< "$FALLBACK_MODELS"
            for fallback in "${FALLBACKS[@]}"; do
              echo "Trying fallback model: $fallback"
              jq --arg model "$fallback" '.model = $model' payload.json > payload_fallback.json
              
              HTTP_CODE=$(curl -sS -o response.json -w "%{http_code}" \
                -X POST \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Content-Type: application/json" \
                -H "Accept: application/json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$MODELS_BASE_URL/chat/completions" \
                --data @payload_fallback.json) || HTTP_CODE="000"
              
              if [[ "$HTTP_CODE" -ge 200 && "$HTTP_CODE" -lt 300 ]]; then
                echo "Success with fallback model: $fallback"
                break
              fi
            done
            
            if [[ "$HTTP_CODE" -lt 200 || "$HTTP_CODE" -ge 300 ]]; then
              echo "All models failed. Exiting."
              exit 1
            fi
          fi

          jq -r '.choices[0].message.content // ""' response.json > summary.md
          echo "---- Summary (first 60 lines) ----"
          head -n 60 summary.md || true

      - name: Assemble summary block
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "${SUMMARY_START}"
            cat summary.md
            echo ""
            echo "${SUMMARY_END}"
          } > summary_block.md

      - name: Update PR description with generated summary
        uses: actions/github-script@v7
        env:
          SUMMARY_START: ${{ env.SUMMARY_START }}
          SUMMARY_END: ${{ env.SUMMARY_END }}
        with:
          script: |
            const fs = require('fs');
            const start = process.env.SUMMARY_START;
            const end = process.env.SUMMARY_END;
            const { owner, repo } = context.repo;
            const pull_number = Number(process.env.PR_NUMBER || context.payload.pull_request?.number);
            
            if (!pull_number) {
              core.setFailed('Missing PR number');
              return;
            }

            try {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
              const body = pr.body || '';
              const block = fs.readFileSync('summary_block.md', 'utf8').trim() + '\n';

              let newBody;
              const startEscaped = start.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const endEscaped = end.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const regex = new RegExp(`${startEscaped}[\\s\\S]*?${endEscaped}`, 'g');
              
              if (body.includes(start) && body.includes(end)) {
                newBody = body.replace(regex, block);
              } else {
                newBody = (body ? body + '\n\n' : '') + block;
              }

              await github.rest.pulls.update({ owner, repo, pull_number, body: newBody });
              core.info('PR description updated with summary block.');
            } catch (error) {
              core.setFailed(`Failed to update PR: ${error.message}`);
            }

      - name: Upload artifacts (summary + context)
        uses: actions/upload-artifact@v4
        with:
          name: pr-auto-summary-${{ github.run_id }}
          path: |
            context.md
            pr.json
            files.json
            commits.json
            pr.diff
            payload.json
            response.json
            summary.md
          retention-days: 7
