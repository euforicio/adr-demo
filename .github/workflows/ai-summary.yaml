name: Update PR Description with AI Summary

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  models: read  # Required for GitHub Models access

jobs:
  summarize-pr:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for accurate diff
      
      - name: Get PR Information
        id: pr-info
        uses: actions/github-script@v7
        with:
          script: |
            // Get PR details
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            // Get list of changed files
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            // Get commits
            const commits = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            // Prepare file changes summary
            const fileChanges = files.data.map(f => 
              `${f.filename}: +${f.additions} -${f.deletions}`
            ).join('\n');
            
            // Prepare commit messages
            const commitMessages = commits.data.map(c => 
              c.commit.message
            ).join('\n');
            
            core.setOutput('title', pr.data.title);
            core.setOutput('body', pr.data.body || 'No description provided');
            core.setOutput('base_branch', pr.data.base.ref);
            core.setOutput('head_branch', pr.data.head.ref);
            core.setOutput('file_changes', fileChanges);
            core.setOutput('commit_messages', commitMessages);
            core.setOutput('pr_number', context.issue.number);
      
      - name: Create temp files for PR summary
        run: |
          echo '${{ steps.pr-info.outputs.title }}' > /tmp/pr_title.txt
          echo '${{ steps.pr-info.outputs.body }}' > /tmp/pr_body.txt
          echo '${{ steps.pr-info.outputs.base_branch }}' > /tmp/base_branch.txt
          echo '${{ steps.pr-info.outputs.head_branch }}' > /tmp/head_branch.txt
          echo '${{ steps.pr-info.outputs.file_changes }}' > /tmp/file_changes.txt
          echo '${{ steps.pr-info.outputs.commit_messages }}' > /tmp/commit_messages.txt
      
      - name: Generate PR Summary with AI
        id: ai-summary
        uses: actions/ai-inference@v1.2.8
        with:
          prompt-file: './.github/prompts/pr-summary.prompt.yml'
          enable-github-mcp: true
          token: ${{ secrets.GITHUB_TOKEN }}
          file_input: |
            pr_title: /tmp/pr_title.txt
            pr_body: /tmp/pr_body.txt
            base_branch: /tmp/base_branch.txt
            head_branch: /tmp/head_branch.txt
            file_changes: /tmp/file_changes.txt
            commit_messages: /tmp/commit_messages.txt
      
      - name: Update PR Description
        uses: actions/github-script@v7
        env:
          AI_SUMMARY: ${{ steps.ai-summary.outputs.response }}
          PR_NUMBER: ${{ steps.pr-info.outputs.pr_number }}
        with:
          script: |
            // Get current PR body
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: parseInt(process.env.PR_NUMBER)
            });
            
            let currentBody = pr.data.body || '';
            
            // Check if we already have an AI summary section
            const summaryMarker = '## 🤖 AI Generated Summary';
            const endMarker = '---\n*This summary was automatically generated';
            
            if (currentBody.includes(summaryMarker)) {
              // Remove existing summary
              const startIndex = currentBody.indexOf(summaryMarker);
              const endIndex = currentBody.indexOf(endMarker);
              if (endIndex > startIndex) {
                currentBody = currentBody.substring(0, startIndex).trim();
              }
            }
            
            // Append new summary
            const aiSummary = process.env.AI_SUMMARY;
            const timestamp = new Date().toLocaleString();
            const newBody = currentBody + '\n\n' + summaryMarker + '\n\n' + aiSummary + '\n\n---\n*This summary was automatically generated by GitHub Models on ' + timestamp + '*';
            
            // Update the PR
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: parseInt(process.env.PR_NUMBER),
              body: newBody
            });
