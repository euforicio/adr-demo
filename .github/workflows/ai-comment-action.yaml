name: AI PR Generator and Updater

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write      # For creating branches and commits
  issues: write        # For commenting on issues
  pull-requests: write # For creating pull requests
  models: read         # For GitHub Models access
  repository-projects: read # For GitHub MCP server

jobs:
  # Job for updating PR when @hank_bot is mentioned
  update-pr-on-mention:
    if: |
      github.event_name == 'issue_comment' && 
      github.event.issue.pull_request && 
      contains(github.event.comment.body, '@hank_bot')
    runs-on: ubuntu-latest
    
    steps:
      - name: React to Comment
        uses: actions/github-script@v7
        with:
          script: |
            // Add a reaction to acknowledge the comment
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });
      
      - name: Get PR Details
        id: pr-details
        uses: actions/github-script@v7
        with:
          script: |
            // Get the PR details
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            // Check if this is an AI-generated PR
            const labels = pr.data.labels.map(l => l.name);
            if (!labels.includes('ai-generated')) {
              core.setFailed('This is not an AI-generated PR');
              return;
            }
            
            core.setOutput('branch', pr.data.head.ref);
            core.setOutput('base_branch', pr.data.base.ref);
            core.setOutput('pr_number', context.issue.number);
            core.setOutput('pr_title', pr.data.title);
            
            // Get the comment that mentioned @hank_bot
            const comment = context.payload.comment.body;
            // Remove the @hank_bot mention and clean up the text
            const instruction = comment.replace(/@hank_bot/gi, '').trim();
            core.setOutput('instruction', instruction);
            core.setOutput('comment_author', context.payload.comment.user.login);
      
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr-details.outputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Environment
        run: |
          echo "Setting up environment for AI code generation"
      
      - name: Setup Git Configuration
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Get Current PR Files
        id: pr-files
        run: |
          # Get list of files changed in this PR
          git diff --name-only origin/${{ steps.pr-details.outputs.base_branch }}..HEAD > changed_files.txt
          
          echo "changed_files<<EOF" >> $GITHUB_OUTPUT
          cat changed_files.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          # Get the content of changed files for context
          echo "file_contents<<EOF" >> $GITHUB_OUTPUT
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              echo "=== File: $file ==="
              head -100 "$file" 2>/dev/null || true
              echo ""
            fi
          done < changed_files.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Create Temp Files for Update Analysis
        run: |
          echo "${{ steps.pr-details.outputs.instruction }}" > /tmp/user_instruction.txt
          echo "${{ steps.pr-details.outputs.pr_title }}" > /tmp/pr_title.txt
          echo "${{ steps.pr-files.outputs.changed_files }}" > /tmp/changed_files.txt
          echo "${{ steps.pr-files.outputs.file_contents }}" > /tmp/file_contents.txt
      
      - name: Analyze Update Request
        id: analyze-update
        uses: actions/ai-inference@v1.2.8
        with:
          prompt-file: './.github/prompts/analyze-update.prompt.yml'
          enable-github-mcp: true
          token: ${{ secrets.GITHUB_TOKEN }}
          input: |
            comment_author: ${{ steps.pr-details.outputs.comment_author }}
          file_input: |
            user_instruction: /tmp/user_instruction.txt
            pr_title: /tmp/pr_title.txt
            changed_files: /tmp/changed_files.txt
            file_contents: /tmp/file_contents.txt
      
      - name: Parse Update Plan
        id: parse-update-plan
        uses: actions/github-script@v7
        env:
          AI_RESPONSE: ${{ steps.analyze-update.outputs.response }}
        with:
          script: |
            let plan;
            try {
              const response = process.env.AI_RESPONSE;
              const jsonStr = response.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
              plan = JSON.parse(jsonStr);
            } catch (e) {
              console.error('Failed to parse AI response:', e);
              plan = {
                update_type: 'modify',
                files_to_modify: [],
                files_to_add: [],
                files_to_remove: [],
                change_summary: 'Unable to parse update request',
                feasible: false,
                reason_if_not_feasible: 'Failed to understand the request'
              };
            }
            
            if (!plan.feasible) {
              core.setFailed(plan.reason_if_not_feasible || 'Update not feasible');
              return;
            }
            
            core.setOutput('update_type', plan.update_type);
            core.setOutput('files_to_modify', JSON.stringify(plan.files_to_modify));
            core.setOutput('files_to_add', JSON.stringify(plan.files_to_add));
            core.setOutput('files_to_remove', JSON.stringify(plan.files_to_remove));
            core.setOutput('change_summary', plan.change_summary);
      
      - name: Generate Updated Code
        id: generate-updates
        uses: actions/ai-inference@v1.2.8
        with:
          prompt-file: './.github/prompts/generate-updates.prompt.yml'
          max-tokens: 4000
          enable-github-mcp: true
          token: ${{ secrets.GITHUB_TOKEN }}
          input: |
            change_summary: ${{ steps.parse-update-plan.outputs.change_summary }}
            files_to_modify: ${{ steps.parse-update-plan.outputs.files_to_modify }}
            files_to_add: ${{ steps.parse-update-plan.outputs.files_to_add }}
            files_to_remove: ${{ steps.parse-update-plan.outputs.files_to_remove }}
          file_input: |
            update_request: /tmp/user_instruction.txt
            file_contents: /tmp/file_contents.txt
      
      - name: Check for Changes and Commit
        id: apply-updates
        env:
          PR_NUMBER: ${{ steps.pr-details.outputs.pr_number }}
          INSTRUCTION: ${{ steps.pr-details.outputs.instruction }}
        run: |
          # MCP should have already made the file changes during the Generate Updated Code step
          # Check if there are any changes
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes detected from MCP operations"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected! Files modified by MCP operations:"
            git status --porcelain
            echo "has_changes=true" >> $GITHUB_OUTPUT
            
            # Add and commit changes
            git add -A
            
            # Create a descriptive commit message
            COMMIT_MSG="AI Update: Responding to @hank_bot mention
          
          Request: ${INSTRUCTION:0:200}
          
          This update was automatically generated based on the comment in PR #${PR_NUMBER}."
            
            git commit -m "$COMMIT_MSG"
            
            # Push the changes
            git push origin HEAD
          fi
      
      - name: Post Success Comment
        if: steps.apply-updates.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr-details.outputs.pr_number }}
          CHANGE_SUMMARY: ${{ steps.parse-update-plan.outputs.change_summary }}
          COMMENT_AUTHOR: ${{ steps.pr-details.outputs.comment_author }}
        with:
          script: |
            // Update the reaction to checkmark
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });
            
            // Post a success comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(process.env.PR_NUMBER),
              body: `🤖 **@hank_bot Update Complete**
              
              Hey @${process.env.COMMENT_AUTHOR}, I've updated the PR based on your request!
              
              ### 📝 Changes Made
              ${process.env.CHANGE_SUMMARY}
              
              ### 🔄 What's Next?
              - Review the updated changes
              - Run tests to ensure everything works
              - Request more changes by mentioning @hank_bot again if needed
              
              ---
              *Powered by GitHub Models AI*`
            });
      
      - name: Post No Changes Comment
        if: steps.apply-updates.outputs.has_changes == 'false'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr-details.outputs.pr_number }}
          COMMENT_AUTHOR: ${{ steps.pr-details.outputs.comment_author }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(process.env.PR_NUMBER),
              body: `🤖 **@hank_bot Response**
              
              Hey @${process.env.COMMENT_AUTHOR}, I processed your request but didn't find any changes to make.
              
              This might happen if:
              - The requested changes are already present
              - The instruction wasn't specific enough
              - The changes conflict with the existing code structure
              
              Please provide more specific instructions and mention @hank_bot again!
              
              ---
              *Powered by GitHub Models AI*`
            });
      
      - name: Handle Update Errors
        if: failure()
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr-details.outputs.pr_number }}
          COMMENT_AUTHOR: ${{ steps.pr-details.outputs.comment_author }}
        with:
          script: |
            // Update reaction to show error
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'confused'
            });
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(process.env.PR_NUMBER),
              body: `❌ **@hank_bot Update Failed**
              
              Hey @${process.env.COMMENT_AUTHOR}, I encountered an error while trying to update the PR.
              
              This could be due to:
              - The request being too complex or ambiguous
              - Conflicts with the current code structure
              - API limitations or processing errors
              
              ### 💡 Suggestions
              - Try being more specific about what needs to be changed
              - Break down complex requests into smaller parts
              - Check if the files you want to modify exist in the PR
              
              You can try again by mentioning @hank_bot with a clearer instruction!
              
              ---
              *Powered by GitHub Models AI*`
            });
